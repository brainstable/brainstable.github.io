<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Страница не найдена — Сергей Мозговой</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#f6f8fb">
<script>
  (function () {
    try {
      var saved = localStorage.getItem('theme');
      document.documentElement.dataset.theme = (saved === 'dark' || saved === 'light') ? saved : 'light';
    } catch (e) {
      document.documentElement.dataset.theme = 'light';
    }
  })();
</script>
<link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
<main class="hero" style="min-height: 80vh; display: grid; place-items: center;">
  <div class="wrap" style="text-align: center;">
    <p class="eyebrow" style="justify-content: center;">404</p>
    <h1 class="hero__title" style="font-size: clamp(2rem, 6vw, 3.4rem);">Страница не нашлась</h1>
    <p class="hero__lead" style="margin-inline: auto;">Возможно, адрес изменился. Вернитесь на главную — там все проекты.</p>
    <p><a class="btn btn--primary" href="/">На главную</a></p>
  </div>
</main>
</body>
</html>
