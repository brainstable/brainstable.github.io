<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" role="img" aria-label="Превью карты исчезнувших деревень">
  <defs>
    <linearGradient id="gh-bg" x1="0" y1="0" x2="0.7" y2="1">
      <stop offset="0" stop-color="#151218"/>
      <stop offset="1" stop-color="#0a0c11"/>
    </linearGradient>
    <pattern id="gh-grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#ffffff" stroke-opacity="0.045"/>
    </pattern>
    <radialGradient id="gh-glow" cx="0.3" cy="0.3" r="0.7">
      <stop offset="0" stop-color="#fb923c" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#fb923c" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="800" height="500" fill="url(#gh-bg)"/>
  <rect width="800" height="500" fill="url(#gh-grid)"/>
  <ellipse cx="260" cy="200" rx="320" ry="220" fill="url(#gh-glow)"/>

  <!-- старые дороги -->
  <path d="M-20 400 C 140 360, 240 380, 340 320 S 560 250, 820 300"
        fill="none" stroke="#94a3b6" stroke-opacity="0.28" stroke-width="2.5" stroke-dasharray="3 9" stroke-linecap="round"/>
  <path d="M340 320 C 380 250, 470 210, 560 180"
        fill="none" stroke="#94a3b6" stroke-opacity="0.22" stroke-width="2" stroke-dasharray="3 9" stroke-linecap="round"/>

  <!-- границы исчезнувших НП -->
  <g fill="#fb923c" fill-opacity="0.08" stroke="#f87171" stroke-opacity="0.55" stroke-width="2" stroke-dasharray="8 6" stroke-linejoin="round">
    <polygon points="180,250 300,210 390,260 350,340 220,340"/>
    <polygon points="470,300 580,270 650,330 610,400 490,395"/>
    <polygon points="560,140 660,120 700,190 620,225 545,200"/>
  </g>

  <!-- существующие деревни -->
  <g fill="#60a5fa" fill-opacity="0.9">
    <circle cx="120" cy="150" r="4"/>
    <circle cx="700" cy="400" r="4"/>
    <circle cx="420" cy="460" r="4"/>
    <circle cx="250" cy="90" r="3.5"/>
  </g>
  <g fill="none" stroke="#60a5fa" stroke-opacity="0.35">
    <circle cx="120" cy="150" r="10"/>
    <circle cx="700" cy="400" r="10"/>
  </g>

  <!-- исчезнувшие деревни -->
  <g>
    <g>
      <circle cx="290" cy="285" r="20" fill="#f87171" fill-opacity="0.12" stroke="#f87171" stroke-opacity="0.5"/>
      <circle cx="290" cy="285" r="6" fill="#f87171"/>
    </g>
    <g>
      <circle cx="560" cy="345" r="16" fill="#f87171" fill-opacity="0.11" stroke="#f87171" stroke-opacity="0.45"/>
      <circle cx="560" cy="345" r="5" fill="#f87171"/>
    </g>
    <g>
      <circle cx="620" cy="170" r="13" fill="#f87171" fill-opacity="0.1" stroke="#f87171" stroke-opacity="0.4"/>
      <circle cx="620" cy="170" r="4.5" fill="#f87171"/>
    </g>
  </g>

  <!-- подпись -->
  <g transform="translate(24, 24)">
    <rect width="236" height="66" rx="10" fill="#0a1118" fill-opacity="0.9" stroke="#ffffff" stroke-opacity="0.12"/>
    <text x="16" y="26" font-family="ui-monospace, Consolas, monospace" font-size="10" fill="#fb923c" letter-spacing="1.3">КРАСНОЯРСКИЙ КРАЙ</text>
    <text x="16" y="48" font-family="ui-sans-serif, Segoe UI, sans-serif" font-size="16" font-weight="600" fill="#e7edf5">Исчезнувшие деревни</text>
  </g>

  <!-- легенда -->
  <g transform="translate(600, 336)">
    <rect width="176" height="80" rx="10" fill="#0a1118" fill-opacity="0.88" stroke="#ffffff" stroke-opacity="0.10"/>
    <g font-family="ui-sans-serif, Segoe UI, sans-serif" font-size="11" fill="#c8d4e2">
      <circle cx="16" cy="24" r="4.5" fill="#f87171"/><text x="30" y="28">исчезнувшие</text>
      <circle cx="16" cy="50" r="4.5" fill="#60a5fa"/><text x="30" y="54">существующие</text>
      <path d="M10 70 H22" stroke="#94a3b6" stroke-opacity="0.6" stroke-dasharray="3 4"/><text x="30" y="74">старые дороги</text>
    </g>
  </g>
</svg>
