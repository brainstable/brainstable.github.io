<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" role="img" aria-label="Превью карты сортоучастков">
  <defs>
    <linearGradient id="gp-bg" x1="0" y1="0" x2="0.7" y2="1">
      <stop offset="0" stop-color="#0e1a20"/>
      <stop offset="1" stop-color="#080e13"/>
    </linearGradient>
    <pattern id="gp-grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#ffffff" stroke-opacity="0.05"/>
    </pattern>
  </defs>

  <rect width="800" height="500" fill="url(#gp-bg)"/>
  <rect width="800" height="500" fill="url(#gp-grid)"/>

  <!-- поля -->
  <g stroke="#0a1118" stroke-width="2" stroke-linejoin="round">
    <polygon points="90,300 240,250 330,300 300,420 150,440" fill="#3f6b4a" fill-opacity="0.65"/>
    <polygon points="240,250 390,210 470,260 430,330 330,300" fill="#8a7a35" fill-opacity="0.6"/>
    <polygon points="330,300 430,330 470,260 560,300 530,410 300,420" fill="#4a6f7a" fill-opacity="0.55"/>
    <polygon points="560,300 700,270 730,380 640,430 530,410" fill="#6b4a7a" fill-opacity="0.45"/>
    <polygon points="390,210 540,170 620,220 560,300 470,260" fill="#7a5a3a" fill-opacity="0.45"/>
  </g>

  <!-- граница участка -->
  <polygon points="80,290 250,240 400,200 560,160 710,262 740,390 620,440 300,430 140,450"
           fill="none" stroke="#6ee7b7" stroke-width="3" stroke-dasharray="14 8" stroke-linejoin="round"/>

  <!-- дороги -->
  <path d="M20 470 C 180 420, 300 440, 420 380 S 690 300, 780 250"
        fill="none" stroke="#e8eef5" stroke-opacity="0.22" stroke-width="3" stroke-linecap="round"/>

  <!-- маркеры -->
  <g>
    <circle cx="300" cy="340" r="22" fill="#6ee7b7" fill-opacity="0.12" stroke="#6ee7b7" stroke-opacity="0.5"/>
    <circle cx="300" cy="340" r="6" fill="#6ee7b7"/>
    <circle cx="620" cy="360" r="18" fill="#60a5fa" fill-opacity="0.14"/>
    <circle cx="620" cy="360" r="5" fill="#60a5fa"/>
  </g>

  <!-- инфо-карточка -->
  <g transform="translate(24, 24)">
    <rect width="272" height="76" rx="10" fill="#0a1118" fill-opacity="0.9" stroke="#ffffff" stroke-opacity="0.12"/>
    <text x="16" y="28" font-family="ui-monospace, Consolas, monospace" font-size="11" fill="#6ee7b7" letter-spacing="1.4">КРАСНОЯРСКИЙ КРАЙ</text>
    <text x="16" y="50" font-family="ui-sans-serif, Segoe UI, sans-serif" font-size="17" font-weight="600" fill="#e7edf5">Минусинский ГСУ</text>
    <text x="16" y="68" font-family="ui-sans-serif, Segoe UI, sans-serif" font-size="11" fill="#94a3b6">южная лесостепная зона</text>
  </g>

  <!-- легенда -->
  <g transform="translate(24, 330)">
    <rect width="188" height="146" rx="10" fill="#0a1118" fill-opacity="0.88" stroke="#ffffff" stroke-opacity="0.10"/>
    <text x="14" y="22" font-family="ui-monospace, Consolas, monospace" font-size="10" fill="#94a3b6" letter-spacing="1.2">КУЛЬТУРЫ</text>
    <g font-family="ui-sans-serif, Segoe UI, sans-serif" font-size="11" fill="#c8d4e2">
      <rect x="14" y="32" width="10" height="10" rx="2" fill="#8a7a35"/><text x="32" y="41">пшеница яровая</text>
      <rect x="14" y="56" width="10" height="10" rx="2" fill="#3f6b4a"/><text x="32" y="65">овёс яровой</text>
      <rect x="14" y="80" width="10" height="10" rx="2" fill="#4a6f7a"/><text x="32" y="89">рапс яровой</text>
      <rect x="14" y="104" width="10" height="10" rx="2" fill="#7a5a3a"/><text x="32" y="113">пар чёрный</text>
      <rect x="14" y="128" width="10" height="10" rx="2" fill="#6b4a7a"/><text x="32" y="137">люцерна</text>
    </g>
  </g>

  <!-- подложки -->
  <g transform="translate(600, 24)">
    <rect width="176" height="34" rx="8" fill="#0a1118" fill-opacity="0.9" stroke="#ffffff" stroke-opacity="0.12"/>
    <g font-family="ui-monospace, Consolas, monospace" font-size="10" fill="#94a3b6">
      <text x="12" y="21">GOOGLE · YANDEX · ESRI</text>
    </g>
  </g>
</svg>
